name: Build
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: "26b"

      - name: Compile
        run: |
          TOOL="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          $TOOL/aarch64-linux-android24-clang -O2 detect.c -o detect

      - name: Save binary
        uses: actions/upload-artifact@v4
        with:
          name: detect
          path: detect
