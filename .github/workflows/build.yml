name: Build
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        uses: android-actions/setup-android@v3

      - name: Compile C++
        run: |
          TOOL="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          $TOOL/aarch64-linux-android24-clang++ -O2 detect.cpp -o detect

      - name: Save binary
        uses: actions/upload-artifact@v4
        with:
          name: detect
          path: detect
