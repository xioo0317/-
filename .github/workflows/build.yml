name: Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        uses: android-actions/setup-android@v3

      - name: ndk‑build compile
        run: |
          export PATH="$ANDROID_NDK_ROOT:$PATH"
          ndk-build -C jni

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: detect
          path: jni/libs/arm64-v8a/detect
